name: SEO maintenance

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

concurrency:
  group: seo-maintenance
  cancel-in-progress: false

jobs:
  audit-and-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SEO_CRON_SECRET: ${{ secrets.SEO_CRON_SECRET }}
    steps:
      - name: Validate configuration
        run: test -n "$SEO_CRON_SECRET"
      - name: Audit published articles
        run: |
          curl --fail-with-body --silent --show-error --max-time 180 --retry 2 \
            -H "x-cron-secret: $SEO_CRON_SECRET" \
            https://winwinback.com/api/cron/seo-audit
      - name: Sync Search Console
        run: |
          curl --fail-with-body --silent --show-error --max-time 180 --retry 2 \
            -H "x-cron-secret: $SEO_CRON_SECRET" \
            https://winwinback.com/api/cron/seo-search-console
